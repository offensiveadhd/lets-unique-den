<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="df-t df-d">
<title id="df-t">How Claude drives den</title>
<desc id="df-d">Den, Doto's home, on the left, Claude on the right, two lanes between them. An edit goes up as a den event: den.memory.forget when you press the cross on a memory line, and the row is marked pending. Claude applies it with the entity tool, action unlearn. Then den.refresh comes down: den reads the live state again and the pending mark clears. den.ask goes up when you point at a line and ask why, and den.highlight comes down on the line Claude cites. den.export goes up when you press Send to Claude. The session block names den.export as the export, den.snapshot as the snapshot and den.load as the restore.</desc>
