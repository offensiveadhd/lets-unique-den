epeatCount="indefinite" values="342 104;342 104;978 104;978 104;342 104;342 104" keyTimes="0;.8083;.8875;.9042;.9058;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8;.8083;.8917;.9;1"/></g>
<g opacity="1"><text x="40" y="300" font-size="22">You press × on a memory line. The row is marked pending.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1458;.1583;.9833;.9958;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude applies it with the <tspan class="m">entity</tspan> tool: <tspan class="m">unlearn</tspan>. The engine never applies an edit on its own.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1583;.1708;.3042;.3167;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">den reads the live state again and the pending mark clears.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3167;.3292;.4625;.475;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">You point at a line and ask: why this?</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.4875;.6208;.6333;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude cites the memory line it came from and makes it glow.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6458;.7792;.7917;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Send to Claude: a memory review, answered in the Claude Code chat.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7917;.8042;.9583;.9708;1"/></g>
