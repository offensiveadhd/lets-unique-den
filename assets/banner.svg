<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="db-t db-d">
<title id="db-t">den</title>
<desc id="db-d">den: Doto's home. Four cards show what the companion learned: a persona card with Doto, a violet orb, his likes as chips, three trait sliders and his memory lines. The pointer drags the chatty slider from 0.40 down to 0.20, then presses the cross on a memory line, which is struck through and fades.</desc>
